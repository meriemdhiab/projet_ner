[paths]
train = /Users/meriemdhiab/Downloads/projet_ner/train.spacy
dev   = /Users/meriemdhiab/Downloads/projet_ner/dev.spacy
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 42

[nlp]
lang       = "en"
pipeline   = ["tok2vec","ner"]
batch_size = 128

[components]

[components.tok2vec]
source = "en_core_web_sm"

[components.ner]
source = "en_core_web_sm"
replace_listeners = ["model.tok2vec"]

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path     = ${paths.train}
max_length = 0

[corpora.dev]
@readers = "spacy.Corpus.v1"
path     = ${paths.dev}
max_length = 0

[training]
patience       = 1500
max_epochs     = 0
max_steps      = 3000
eval_frequency = 50
dropout        = 0.1
dev_corpus     = "corpora.dev"
train_corpus   = "corpora.train"

[training.optimizer]
@optimizers = "Adam.v1"
beta1     = 0.9
beta2     = 0.999
eps       = 1e-8
L2        = 1e-6
grad_clip = 1.0

[training.optimizer.learn_rate]
@schedules   = "warmup_linear.v1"
warmup_steps = 250
total_steps  = 3000
initial_rate = 5e-4

[training.batcher]
@batchers         = "spacy.batch_by_words.v1"
discard_oversize  = false
tolerance         = 0.2

[training.batcher.size]
@schedules = "compounding.v1"
start    = 100
stop     = 1000
compound = 1.001

[initialize]
vectors = "en_core_web_sm"
